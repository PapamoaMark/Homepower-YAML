type: sections
title: HomePower Data
icon: mdi:home-lightning-bolt-outline
cards: []
sections:
  - type: grid
    cards:
      - type: heading
        icon: mdi:fridge
        heading: House load and Solar power
        heading_style: title
      - type: statistics-graph
        entities:
          - entity: sensor.energizer_homepower_house_load
          - sensor.energizer_homepower_solar_pv_power
        days_to_show: 1
        period: 5minute
        chart_type: line
        stat_types:
          - mean
        grid_options:
          columns: full
      - type: tile
        entity: sensor.energizer_homepower_house_load
        grid_options:
          rows: auto
          columns: full
      - type: tile
        entity: sensor.energizer_homepower_solar_pv_power
        grid_options:
          rows: auto
          columns: full
      - type: tile
        entity: sensor.energizer_homepower_solar_generated_today
        grid_options:
          rows: auto
          columns: full
      - type: tile
        entity: sensor.energizer_homepower_state_of_charge
        grid_options:
          rows: auto
          columns: full
      - type: statistics-graph
        entities:
          - sensor.energizer_homepower_state_of_charge
        days_to_show: 1
        period: 5minute
        chart_type: line-stack
        stat_types:
          - mean
        grid_options:
          columns: full
    column_span: 1
  - type: grid
    cards:
      - type: heading
        icon: mdi:battery
        heading: Battery Data
        heading_style: title
      - type: tile
        entity: sensor.energizer_homepower_state_of_charge
        grid_options:
          rows: auto
          columns: full
      - type: tile
        entity: sensor.energizer_homepower_charge_power
        grid_options:
          rows: auto
          columns: full
      - type: tile
        entity: sensor.energizer_homepower_discharge_power
        grid_options:
          rows: auto
          columns: full
      - type: statistics-graph
        grid_options:
          columns: full
        entities:
          - entity: sensor.energizer_homepower_battery_power
        title: Battery (-ve charging)
        days_to_show: 1
        period: 5minute
        chart_type: line-stack
        stat_types:
          - mean
    column_span: 1
  - type: grid
    cards:
      - type: heading
        heading: Grid Import & Export
        heading_style: title
        icon: mdi:transmission-tower
      - type: heading
        icon: ''
        heading: Current current (Watts)
        heading_style: subtitle
      - type: tile
        entity: sensor.energizer_homepower_grid_export
        grid_options:
          rows: auto
          columns: full
      - type: tile
        entity: sensor.energizer_homepower_grid_import
        grid_options:
          rows: auto
          columns: full
      - type: heading
        icon: ''
        heading: Total KWh today
        heading_style: subtitle
      - type: tile
        entity: sensor.energizer_homepower_grid_exported_today
        grid_options:
          rows: auto
          columns: full
      - type: tile
        entity: sensor.energizer_homepower_grid_imported_today
        grid_options:
          rows: auto
          columns: full
      - type: heading
        icon: mdi:chart-line
        heading: Graphs
        heading_style: subtitle
      - type: statistics-graph
        grid_options:
          columns: full
        entities:
          - sensor.energizer_homepower_grid_power
        title: Grid (-ve exporting)
        days_to_show: 1
        period: 5minute
        chart_type: line-stack
        stat_types:
          - mean
header:
  layout: start
  badges_position: bottom
  badges_wrap: wrap
max_columns: 4
show_icon_and_title: true
